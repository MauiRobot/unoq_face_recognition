<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Arduino UNO Q Face Recognition</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #f2f4f7;
            color: #202124;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 18px rgba(0,0,0,.10);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        p {
            color: #555;
        }

        .camera-container {
            margin: 25px 0;
            border-radius: 12px;
            overflow: hidden;
            background: black;
            border: 1px solid #d0d0d0;
        }

        .camera-stream {
            display: block;
            width: 100%;
            height: auto;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e4e4e4;
        }

        .status-row:last-child {
            border-bottom: none;
        }

        .status-value {
            font-weight: bold;
            color: #0a8a2a;
        }

        @media (max-width:700px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 18px;
            }

            h1 {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Arduino UNO Q Face Recognition</h1>

<p>
Live camera test using Flask and OpenCV.
</p>

<div class="camera-container">

<img
    class="camera-stream"
    src="{{ url_for('video_feed') }}"
    alt="Live Camera">

</div>

<h2>System Status</h2>

<div class="status-row">
    <span>Camera</span>
    <span class="status-value">
        {{ camera_status }}
    </span>
</div>

<div class="status-row">
    <span>Flask</span>
    <span class="status-value">
        {{ flask_status }}
    </span>
</div>

<div class="status-row">
    <span>OpenCV</span>
    <span class="status-value">
        {{ opencv_status }}
    </span>
</div>

</div>

</div>

</body>

</html>
